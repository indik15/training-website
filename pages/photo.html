<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Фотографії лам">
  <title>Фотографії лам</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="custom-green-theme">

  <header class="text-center bg-green-600 text-white py-4">
    <h1 class="text-4xl font-bold">Фотографії лам</h1>
    <nav class="mt-3 flex justify-center space-x-6">
      <a href="../index.html" class="hover:underline">Головна</a>
      <a href="morphology.html" class="hover:underline">Зовнішній вигляд</a>
      <a href="nutrition.html" class="hover:underline">Харчування</a>
      <a href="population.html" class="hover:underline">Ареал</a>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10">
    <div class="relative">
      <div class="carousel-item active">
        <a href="../images/1.PNG" target="_blank">
          <img src="../images/1.PNG" alt="Лама в траві" class="w-full rounded shadow-md">
        </a>
      </div>
      <div class="carousel-item">
        <a href="../images/2.PNG" target="_blank">
          <img src="../images/2.PNG" alt="Лама в полі" class="w-full rounded shadow-md">
        </a>
      </div>
      <div class="carousel-item">
        <a href="../images/3.PNG" target="_blank">
          <img src="../images/3.PNG" alt="Європейська лама" class="w-full rounded shadow-md">
        </a>
      </div>
      <div class="carousel-item">
        <a href="../images/4.PNG" target="_blank">
          <img src="../images/4.PNG" alt="Лама на лузі" class="w-full rounded shadow-md">
        </a>
      </div>
      <div class="carousel-item">
        <a href="../images/5.PNG" target="_blank">
          <img src="../images/5.PNG" alt="Лама в лісі" class="w-full rounded shadow-md">
        </a>
      </div>
      <button onclick="prevSlide()" class="absolute left-0 top-1/2 -translate-y-1/2 bg-green-600 text-white px-4 py-2 rounded-l hover:bg-green-700">❮</button>
      <button onclick="nextSlide()" class="absolute right-0 top-1/2 -translate-y-1/2 bg-green-600 text-white px-4 py-2 rounded-r hover:bg-green-700">❯</button>
    </div>
  </main>

  <footer class="bg-gray-800 text-white text-center py-3">
    <p>&copy; 2025 Сайт про лам</p>
  </footer>

  <script>
    const items = document.querySelectorAll('.carousel-item');
    let index = 0;

    function showSlide(i) {
      items.forEach((item, idx) => {
        item.classList.toggle('active', idx === i);
      });
    }

    function nextSlide() {
      index = (index + 1) % items.length;
      showSlide(index);
    }

    function prevSlide() {
      index = (index - 1 + items.length) % items.length;
      showSlide(index);
    }
  </script>

</body>
</html>
